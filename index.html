          linkDiscord: "Discord",
          linkSpotify: "Spotify",
          linkEmail: "Contact me",
          linkSupport: "Ko-fi",
          linkGithub: "GitHub",
          linkTwitter: "X (Twitter)",
          linkInstagram: "Instagram",
          linkDiscordCta: "Join",
          ctaOpen: "Open",
          ctaVisit: "Visit",
          ctaNoAccount: config.noAccountEn,
          footerTagline: "Content creator, dev & tech",
        },
        fr: {
          title: "À propos de moi",
          bio: config.bioFr,
          footer: "© 2026 Liqoy",
          languageLabel: "Langue",
          linkLatestTag: "YouTube",
          linkDiscordTag: "Communauté",
          linkSpotifyTag: "Musique",
          linkEmailTag: "Contact",
          linkSupportTag: "Soutien",
          linkGithubTag: "Code",
          linkTwitterTag: "Social",
          linkInstagramTag: "Photos",
          linkLatest: "Dernière vidéo",
          linkDiscord: "Discord",
          linkSpotify: "Spotify",
          linkEmail: "Me contacter",
          linkSupport: "Ko-fi",
          linkGithub: "GitHub",
          linkTwitter: "X (Twitter)",
          linkInstagram: "Instagram",
          linkDiscordCta: "Rejoindre",
          ctaOpen: "Ouvrir",
          ctaVisit: "Visiter",
          ctaNoAccount: config.noAccountFr,
          footerTagline: "Créateur de contenu, dev & tech",
        },
      };

      function setActiveLang(lang) {
        const dict = i18n[lang] || i18n.fr;
        document.documentElement.lang = lang;
        elName.textContent = dict.title;
        elBio.textContent = dict.bio;
        if (elFooterText) elFooterText.textContent = dict.footer;
        document.querySelector(".lang-switch")?.setAttribute("aria-label", dict.languageLabel);
        const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
        set("link-latest-tag", dict.linkLatestTag);
        set("link-discord-tag", dict.linkDiscordTag);
        set("link-spotify-tag", dict.linkSpotifyTag);
        set("link-email-tag", dict.linkEmailTag);
        set("link-support-tag", dict.linkSupportTag);
        set("link-github-tag", dict.linkGithubTag);
        set("link-twitter-tag", dict.linkTwitterTag);
        set("link-instagram-tag", dict.linkInstagramTag);
        set("link-latest-label", dict.linkLatest);
        set("link-discord-label", dict.linkDiscord);
        set("link-spotify-label", dict.linkSpotify);
        set("link-email-label", dict.linkEmail);
        set("link-support-label", dict.linkSupport);
        set("link-github-label", dict.linkGithub);
        set("link-twitter-label", dict.linkTwitter);
        set("link-instagram-label", dict.linkInstagram);
        set("link-discord-cta", dict.linkDiscordCta);
        set("link-latest-cta-hover", dict.ctaOpen);
        set("link-spotify-cta-hover", dict.ctaOpen);
        set("link-email-cta-hover", dict.ctaVisit);
        set("link-support-cta-hover", dict.ctaOpen);
        set("link-github-cta-hover", dict.ctaOpen);
        set("link-twitter-cta-hover", dict.ctaNoAccount);
        set("link-instagram-cta-hover", dict.ctaNoAccount);
        set("footer-tagline", dict.footerTagline);
        elLangEn.classList.toggle("active", lang === "en");
        elLangFr.classList.toggle("active", lang === "fr");
        localStorage.setItem("lang", lang);
      }

      elLangEn.addEventListener("click", () => setActiveLang("en"));
      elLangFr.addEventListener("click", () => setActiveLang("fr"));

      const savedLang = localStorage.getItem("lang");
      setActiveLang(savedLang === "en" ? "en" : "fr");

      document.getElementById("link-latest").setAttribute("data-href", config.latestVideoUrl);
      document.getElementById("link-discord").setAttribute("data-href", config.discordUrl);
      document.getElementById("link-spotify").setAttribute("data-href", config.spotifyUrl);
      document.getElementById("link-email").setAttribute("data-href", "contact.html");
      document.getElementById("link-support").setAttribute("data-href", config.supportUrl);
      document.getElementById("link-github").setAttribute("data-href", config.githubUrl);

      document.body.addEventListener("click", function(e) {
        var a = e.target.closest("a[data-href]");
        if (!a || a.classList.contains("link-disabled")) return;
        var url = a.getAttribute("data-href");
        if (!url || url === "#") return;
        e.preventDefault();
        if (a.getAttribute("data-same") === "1") location.href = url;
        else window.open(url, "_blank", "noopener,noreferrer");
      });

      document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
      document.addEventListener("copy", function(e) { e.preventDefault(); });
      document.addEventListener("dragstart", function(e) {
        if (e.target.tagName === "A" || e.target.tagName === "IMG" || e.target.closest("a")) e.preventDefault();
      });

      const elThemeToggle = document.getElementById("theme-toggle");
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
      }

      const savedTheme = localStorage.getItem("theme");
      const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      applyTheme(savedTheme || (prefersLight ? "light" : "dark"));

      elThemeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || "dark";
        applyTheme(current === "light" ? "dark" : "light");
      });

      const header = document.querySelector(".site-header");
      const headerScrollThreshold = 20;
      function updateHeaderScroll() {
        if (window.scrollY > headerScrollThreshold) {
          header?.classList.add("header-scrolled");
        } else {
          header?.classList.remove("header-scrolled");
        }
      }
      window.addEventListener("scroll", updateHeaderScroll, { passive: true });
      updateHeaderScroll();
    </script>
  </body>
</html>
